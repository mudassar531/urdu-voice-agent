# Urdu Voice Demo — the public web demo tenant.
#
# Fully Urdu, single-language. All-remote pipeline so the worker stays light
# enough for a free-tier deploy:
#   - STT: Azure Cognitive Services (azure_stt) — AZURE_SPEECH_KEY/_REGION
#   - TTS: Azure Cognitive Services (urdu_tts)  — AZURE_SPEECH_KEY/_REGION (same)
#   - LLM: Gemma 4 31B via LiveKit Inference     — LIVEKIT_API_KEY/SECRET (no extra key)
#
# Tried urdu_stt (Speechmatics) + urdu_tts (Azure) on 2026-07-09 after
# Soniox's org balance ran out -- reverted. Confirmed via memory
# instrumentation that importing livekit-plugins-speechmatics alone
# (~120-150MB) OOMs the 512MB web-demo instance on its own, before Azure's
# import was ever reached. Trying Azure-only (STT+TTS both azure, no
# Speechmatics) next -- pays the livekit-plugins-azure import cost exactly
# once instead of stacking two heavy SDKs (see azure_stt.py's docstring and
# workspace CLAUDE.md "Render deployment" for the full investigation).
# Falls back to soniox (proven to fit, needs a funded account) if this
# doesn't fit either.
#
# No phone number: visitors reach this agent from the landing page over WebRTC.
# Routing pins here via SINGLE_TENANT_MODE=true + DEFAULT_TENANT_SLUG=urdu-demo
# (see src/config/routing.py and loader.get_default).
#
# To A/B the LLM without touching code, change llm.model to
# "google/gemini-2.5-flash" (still provider: inference, still no extra key), or
# switch llm.provider to "gemini_api" + set GOOGLE_API_KEY.

tenant:
  id: "000000000000000000000020"
  slug: "urdu-demo"
  name: "Urdu Voice Demo"
  phone_numbers: []

personality:
  system_prompt: |
    آپ ایک دوستانہ، مہذب اور ذہین اردو وائس اسسٹنٹ ہیں۔ یہ ایک لائیو ڈیمو ہے
    جو LiveKit، Azure اور Gemma کی مدد سے بنایا گیا ہے۔

    اہم ہدایات:
    - ہمیشہ صرف اردو میں، اردو رسمالخط (نستعلیق) میں جواب دیں — رومن اردو یا
      انگریزی میں ہرگز نہیں، کیونکہ آواز کا انجن صرف اردو رسمالخط کو درست ادا
      کرتا ہے۔
    - جواب مختصر، قدرتی اور بات چیت جیسے رکھیں، جیسے فون پر کوئی انسان بات کر
      رہا ہو۔ ایک وقت میں ایک ہی نکتہ یا سوال۔
    - گرمجوشی سے پیش آئیں؛ صارف کا نام پوچھ سکتے ہیں اور اُن کی بات میں دلچسپی
      ظاہر کریں۔
    - اگر موجودہ وقت پوچھا جائے تو get_current_time ٹول استعمال کریں۔
    - اگر کوئی بات آپ کے دائرہکار سے باہر ہو تو دیانتداری سے بتا دیں۔
    - جب صارف بات ختم کرنا چاہے یا خدا حافظ کہے تو مہذب انداز میں end_call ٹول
      کے ذریعے کال ختم کریں۔
  greeting: "السلام علیکم! میں آپ کا اردو وائس اسسٹنٹ ہوں۔ آپ مجھ سے کسی بھی موضوع پر بات کر سکتے ہیں۔ بتائیے، میں آپ کی کیا مدد کر سکتا ہوں؟"
  greeting_allow_interruptions: true
  fallback: "معاف کیجیے، میں یہ بات ٹھیک سے سمجھ نہیں سکا۔ کیا آپ دوبارہ بتائیں گے؟"
  goodbye: "آپ سے بات کر کے خوشی ہوئی۔ اللہ حافظ!"

languages:
  default: "ur"
  available: ["ur"]
  ask_on_start: false

voice:
  stt_provider: azure_stt
  tts_provider: urdu_tts
  tts_voice_id: "ur-PK-UzmaNeural"
  speed: 1.0
  voices:
    ur: "ur-PK-UzmaNeural"

llm:
  provider: inference
  model: google/gemma-4-31b-it
  temperature: 0.2

behavior:
  language: ur
  max_call_duration_seconds: 600
  allow_interruptions: true

knowledge_base:
  enabled: false

transfer:
  enabled: false

tools:
  platform:
    - get_current_time
    - end_call
  tenant: []

responses:
  silence_prompt: "کیا آپ ابھی بھی لائن پر ہیں؟ براہ کرم بتائیے۔"
  silence_goodbye: "لگتا ہے رابطہ منقطع ہو گیا۔ اللہ حافظ!"
  fallback: "معاف کیجیے، اس بات کا جواب میرے پاس نہیں ہے۔"
  goodbye: "اللہ حافظ!"
  tool_wait: "ایک لمحہ..."

silence:
  prompt_timeout: 20.0
  goodbye_timeout: 40.0
  monitor_interval: 2.0
